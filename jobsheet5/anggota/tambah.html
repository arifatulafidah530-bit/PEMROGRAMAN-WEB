<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Anggota | SIMPUS-Mini</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header>
    <div class="container">
        <h1><i class="bi bi-book-fill"></i> SIMPUS-Mini</h1>

        <input type="checkbox" id="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">
            <i class="bi bi-list"></i>
        </label>

        <nav>
            <a href="../index.html">
                <i class="bi bi-house-door-fill"></i> Beranda
            </a>
            <a href="../buku/list.html">
                <i class="bi bi-book-fill"></i> Daftar Buku
            </a>
            <a href="../buku/tambah.html">
                <i class="bi bi-plus-circle-fill"></i> Tambah Buku
            </a>
            <a href="list.html">
                <i class="bi bi-people-fill"></i> Daftar Anggota
            </a>
            <a href="tambah.html" class="active">
                <i class="bi bi-person-plus-fill"></i> Tambah Anggota
            </a>
        </nav>
    </div>
</header>

<main>
    <section>
        <h2>
            <i class="bi bi-person-plus-fill"></i> Tambah Anggota
        </h2>

        <p class="page-description">
            Tambahkan data anggota baru ke dalam sistem perpustakaan.
        </p>

        <form id="form-tambah">

            <div class="form-group">
                <label for="nama">Nama Anggota</label>
                <input
                    type="text"
                    id="nama"
                    name="nama"
                    placeholder="Masukkan nama anggota"
                >
            </div>

            <div class="form-group">
                <label for="no_anggota">No. Anggota</label>
                <input
                    type="text"
                    id="no_anggota"
                    name="no_anggota"
                    placeholder="Contoh: A006"
                >
            </div>

            <div class="form-group">
                <label for="alamat">Alamat</label>
                <input
                    type="text"
                    id="alamat"
                    name="alamat"
                    placeholder="Masukkan alamat"
                >
            </div>

            <div class="form-group">
                <label for="no_hp">No. HP</label>
                <input
                    type="text"
                    id="no_hp"
                    name="no_hp"
                    placeholder="Masukkan nomor HP"
                >
            </div>

            <button type="submit" class="btn-simpan">
                <i class="bi bi-save-fill"></i> Simpan Anggota
            </button>

        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 SIMPUS-Mini | Jobsheet 5 - JavaScript DOM & Event</p>
</footer>

<script src="../assets/js/app.js"></script>

</body>
</html>
