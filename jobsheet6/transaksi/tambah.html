<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaundryKu | Tambah Transaksi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header>
    <div class="brand">
        <div class="brand-icon">
            <i class="bi bi-basket-fill"></i>
        </div>
        <div>
            <h1>LaundryKu</h1>
            <p>Layanan Laundry</p>
        </div>
    </div>

    <input type="checkbox" id="nav-toggle">

    <label for="nav-toggle" class="nav-toggle-label">
        <i class="bi bi-list"></i>
    </label>

    <nav>
        <a href="../index.html">
            <i class="bi bi-house-door-fill"></i>
            Beranda
        </a>
        <a href="../pelanggan/list.html">
            <i class="bi bi-people-fill"></i>
            Pelanggan
        </a>
        <a href="../pelanggan/tambah.html">
            <i class="bi bi-person-plus-fill"></i>
            Tambah Pelanggan
        </a>
        <a href="list.html" class="active">
            <i class="bi bi-receipt"></i>
            Transaksi
        </a>
    </nav>
</header>

<main>
    <div class="page-header">
        <h2>Tambah Transaksi</h2>
        <p>Tambahkan transaksi laundry baru.</p>
    </div>

    <div class="content-card">
        <form id="form-tambah">

            <div class="form-grid">

                <div class="form-group">
                    <label for="kode">Kode Transaksi</label>
                    <input type="text" id="kode" name="kode" required>
                </div>

                <div class="form-group">
                    <label for="nama_pelanggan">Nama Pelanggan</label>
                    <input type="text" id="nama_pelanggan" name="nama_pelanggan" required>
                </div>

                <div class="form-group">
                    <label for="jenis_layanan">Jenis Layanan</label>
                    <select id="jenis_layanan" name="jenis_layanan" required>
                        <option value="">Pilih layanan</option>
                        <option value="Cuci Kering">Cuci Kering</option>
                        <option value="Cuci Setrika">Cuci Setrika</option>
                        <option value="Setrika">Setrika</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="berat">Berat Laundry (kg)</label>
                    <input type="number" id="berat" name="berat" min="1" required>
                </div>

                <div class="form-group">
                    <label for="total_biaya">Total Biaya</label>
                    <input type="number" id="total_biaya" name="total_biaya" min="0" required>
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status" required>
                        <option value="">Pilih status</option>
                        <option value="Diproses">Diproses</option>
                        <option value="Selesai">Selesai</option>
                        <option value="Diambil">Diambil</option>
                    </select>
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    <i class="bi bi-save-fill"></i>
                    Simpan
                </button>

                <button type="reset" class="btn-reset">
                    <i class="bi bi-arrow-counterclockwise"></i>
                    Reset
                </button>
            </div>

        </form>
    </div>
</main>

<footer>
    <p>&copy; 2026 LaundryKu. Semua hak dilindungi.</p>
</footer>

<script src="../assets/js/app.js"></script>

</body>
</html>
