<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaundryKu | Daftar Pelanggan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header>
    <div class="brand">
        <div class="brand-icon">
            <i class="bi bi-basket-fill"></i>
        </div>
        <div>
            <h1>LaundryKu</h1>
            <p>Layanan Laundry</p>
        </div>
    </div>

    <input type="checkbox" id="nav-toggle">

    <label for="nav-toggle" class="nav-toggle-label">
        <i class="bi bi-list"></i>
    </label>

    <nav>
        <a href="../index.html">
            <i class="bi bi-house-door-fill"></i>
            Beranda
        </a>
        <a href="list.html" class="active">
            <i class="bi bi-people-fill"></i>
            Pelanggan
        </a>
        <a href="tambah.html">
            <i class="bi bi-person-plus-fill"></i>
            Tambah Pelanggan
        </a>
        <a href="../transaksi/list.html">
            <i class="bi bi-receipt"></i>
            Transaksi
        </a>
    </nav>
</header>

<main>
    <div class="page-header">
        <h2>Daftar Pelanggan</h2>
        <p>Data pelanggan LaundryKu.</p>
    </div>

    <div class="content-card">
        <div class="search-box">
            <input type="text" id="search-box" placeholder="Cari pelanggan...">
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Nama Pelanggan</th>
                        <th>No. HP</th>
                        <th>Alamat</th>
                        <th>Jenis Layanan</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="tabel-pelanggan"></tbody>
            </table>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2026 LaundryKu. Semua hak dilindungi.</p>
</footer>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/pelanggan.js"></script>

</body>
</html>
